<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Supply Shock 2040</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* ----------------------------------------------------------------------
   DESIGN PLAN
   Layout: "Briefing room" — a fixed left phase-rail (becomes a horizontal
   pill scroller on phones) beside a document-like main pane; the teacher
   view swaps the rail for a top tab strip over a card/table dashboard.
   Color:  --bg --surface --ink --ink-dim --line --water --food --warn --good
   Type:   --font-display (Fraunces, dossier headings) /
           --font-body (IBM Plex Sans) / --font-mono (IBM Plex Mono, for
           tokens, timestamps and every figure that should line up)
   ---------------------------------------------------------------------- */
:root{
  --bg:#05070f; --surface:#0b1026; --surface-2:#10163a;
  --ink:#eaf6ff; --ink-dim:#8294c2; --line:#1d2c52;
  --water:#00e5ff; --water-ink:#9df3ff; --water-soft:#06202c;
  --food:#ff9d2e; --food-ink:#ffd199; --food-soft:#2a1704;
  --plum:#c061ff; --plum-ink:#e8c3ff; --plum-soft:#200b36;
  --warn:#ff3b6b; --warn-soft:#2b0414;
  --good:#39ff9d; --good-soft:#06241a;
  --accent-text:#04101c;
  --font-display:'Orbitron', 'Rajdhani', sans-serif;
  --font-body:'Rajdhani', -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius:10px;
  --shadow:0 0 1px rgba(0,229,255,.5), 0 4px 22px rgba(0,229,255,.14);
  color-scheme: dark;
}
/* The existing accessibility "contrast" cycle (system/dark/light) is repurposed:
   the neon look is now the single visual language, so the "light" state becomes
   a brighter, thicker-bordered High-Contrast Neon variant rather than a literal
   light theme — keeping a genuine accessibility option without breaking the skin. */
:root[data-theme="light"]{
  --bg:#000000; --surface:#060a16; --surface-2:#0b1430;
  --ink:#ffffff; --ink-dim:#c3d2f2; --line:#3f66ad;
  --water:#3df2ff; --water-ink:#e3fcff; --water-soft:#07222f;
  --food:#ffb24d; --food-ink:#ffe8c7; --food-soft:#301c04;
  --plum:#d58bff; --plum-ink:#f6e3ff; --plum-soft:#271040;
  --warn:#ff6688; --warn-soft:#350619;
  --good:#5bffb0; --good-soft:#07301f;
  --accent-text:#000000;
  --shadow:0 0 0 1px rgba(255,255,255,.25), 0 0 26px rgba(61,242,255,.3);
  color-scheme: dark;
}
@media (prefers-reduced-motion:no-preference){
  .scanlines{position:fixed; inset:0; pointer-events:none; z-index:1;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,0) 0 3px, rgba(0,229,255,.025) 3px 4px);
  }
}
.bg-glow{position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(circle at 12% 18%, rgba(192,97,255,.16), transparent 32%),
    radial-gradient(circle at 88% 8%, rgba(0,229,255,.14), transparent 30%),
    radial-gradient(circle at 70% 92%, rgba(255,157,46,.08), transparent 28%);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:var(--fs,16px); line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0 0 .4em; font-weight:600; color:var(--ink)}
h1{font-size:1.9rem; font-weight:700} h2{font-size:1.4rem} h3{font-size:1.12rem} h4{font-size:1rem}
p{margin:0 0 .8em; max-width:65ch} small{font-size:.82em}
a{color:var(--water)}
label{font-weight:600; font-size:.88rem}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums}
.muted{color:var(--ink-dim)}
button{font:inherit; cursor:pointer}
input,textarea,select{font:inherit; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:7px; padding:.55em .7em; width:100%}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--water); outline-offset:2px}
textarea{resize:vertical; min-height:5em; font-family:var(--font-body)}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.skip-link{position:absolute; left:8px; top:-48px; background:var(--ink); color:var(--bg); padding:.6em 1em; border-radius:8px; z-index:100; transition:top .15s}
.skip-link:focus{top:8px}
@media (prefers-reduced-motion:no-preference){ .fade-in{animation:fadeIn .25s ease-out} }
@keyframes fadeIn{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}

/* ---- buttons ---- */
.btn{display:inline-flex; align-items:center; gap:.5em; border-radius:8px; padding:.6em 1.1em; font-weight:600; font-size:.92rem; border:1.5px solid var(--line); background:var(--surface); color:var(--ink)}
.btn:hover{border-color:var(--ink-dim)}
.btn-primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn-primary:hover{opacity:.9}
.btn-water{background:var(--water); color:var(--accent-text); border-color:var(--water)}
.btn-food{background:var(--food); color:var(--accent-text); border-color:var(--food)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-dim)}
.btn-ghost:hover{color:var(--ink); background:var(--surface-2)}
.btn-sm{padding:.4em .75em; font-size:.82rem}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn-row{display:flex; gap:.6em; flex-wrap:wrap; margin-top:1.4em}

/* ---- top bar ---- */
.topbar{display:flex; align-items:center; gap:1em; flex-wrap:wrap; padding-block:.8em; border-bottom:1.5px solid var(--line); margin-bottom:1.2em}
.wordmark{font-family:var(--font-display); font-weight:700; font-size:1.08rem; display:flex; align-items:baseline; gap:.5em; white-space:nowrap}
.wordmark .tag{font-family:var(--font-mono); font-weight:500; font-size:.68rem; color:var(--ink-dim); letter-spacing:.04em; text-transform:uppercase; border:1px solid var(--line); border-radius:5px; padding:.15em .45em}
.topbar-spacer{flex:1}
.a11y-controls{display:flex; align-items:center; gap:.35em; border-left:1.5px solid var(--line); padding-left:1em; margin-left:.2em}
.fs-btn{width:2em; height:2em; border-radius:7px; border:1.5px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:700}
.role-switch{display:flex; gap:.3em; background:var(--surface-2); padding:.25em; border-radius:9px}
.role-switch button{padding:.4em .85em; border-radius:6px; border:none; background:transparent; font-weight:600; font-size:.84rem; color:var(--ink-dim)}
.role-switch button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

/* ---- layout shell: journey rendered as a game-style path map ---- */
.shell{display:flex; gap:1.6em; align-items:flex-start}
.rail{width:236px; flex:none; position:sticky; top:.8em; display:flex; flex-direction:column; gap:1.3em; max-height:calc(100vh - 1.6em); overflow-y:auto; padding-right:.2em}
.rail-group{position:relative; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:.8em .8em .9em; box-shadow:var(--shadow)}
.rail-group-label{display:flex; align-items:center; gap:.5em; font-family:var(--font-mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; font-weight:700; padding:0 0 .7em; color:var(--ink-dim)}
.rail-group-label .zone-badge{width:1.9em; height:1.9em; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; background:var(--surface-2); color:var(--ink-dim); border:1.5px solid var(--line)}
.rail-group[data-accent="water"] .zone-badge{background:var(--water-soft); color:var(--water-ink); border-color:var(--water)}
.rail-group[data-accent="food"] .zone-badge{background:var(--food-soft); color:var(--food-ink); border-color:var(--food)}
.rail-group[data-accent="plum"] .zone-badge{background:var(--plum-soft); color:var(--plum-ink); border-color:var(--plum)}
.rail-group[data-accent="good"] .zone-badge{background:var(--good-soft); color:var(--good); border-color:var(--good)}
.rail-group-items{position:relative; display:flex; flex-direction:column; gap:.3em}
.rail-group-items::before{content:'';position:absolute; left:1.15em; top:0; bottom:0; width:2px; background:repeating-linear-gradient(to bottom, var(--line) 0 5px, transparent 5px 9px); z-index:0}
.rail-step{position:relative; z-index:1; display:flex; align-items:center; gap:.7em; padding:.4em .4em; border-radius:9px; border:none; background:transparent; text-align:left; width:100%; color:var(--ink-dim)}
.rail-step:nth-child(2n){transform:translateX(7px)}
.rail-step .dot{position:relative; width:2.1em; height:2.1em; border-radius:50%; border:2px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; background:var(--surface); color:var(--ink-dim)}
.rail-step .lbl{display:flex; flex-direction:column; min-width:0}
.rail-step .lbl .name{font-size:.84rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rail-step[aria-current="step"]{background:var(--surface-2)}
.rail-step[aria-current="step"]{color:var(--ink)}
.rail-step[aria-current="step"] .dot{border-color:var(--ink); color:var(--ink); box-shadow:0 0 0 4px var(--surface-2)}
.rail-group[data-accent="water"] .rail-step[aria-current="step"] .dot{border-color:var(--water); color:var(--water-ink)}
.rail-group[data-accent="food"] .rail-step[aria-current="step"] .dot{border-color:var(--food); color:var(--food-ink)}
.rail-group[data-accent="plum"] .rail-step[aria-current="step"] .dot{border-color:var(--plum); color:var(--plum-ink)}
.rail-group[data-accent="good"] .rail-step[aria-current="step"] .dot{border-color:var(--good); color:var(--good)}
@media (prefers-reduced-motion:no-preference){
  .rail-step[aria-current="step"] .dot::after{content:'';position:absolute; inset:-5px; border-radius:50%; border:2px solid currentColor; opacity:.5; animation:pulseRing 1.8s ease-out infinite}
}
@keyframes pulseRing{0%{transform:scale(.8); opacity:.6}100%{transform:scale(1.35); opacity:0}}
.rail-step.done .dot{background:var(--good); color:var(--accent-text); border-color:var(--good)}
.rail-step.done{color:var(--ink)}
.rail-step .star{position:absolute; top:-5px; right:-5px; width:1.1em; height:1.1em; border-radius:50%; background:var(--food); color:#fff; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--surface)}
.rail-step:disabled .dot{color:var(--ink-dim); opacity:.6}
.rail-step:disabled{opacity:.55}
.main{flex:1; min-width:0; max-width:760px}
@media (max-width:860px){
  .shell{flex-direction:column}
  .rail{position:static; width:100%; max-height:none; flex-direction:row; overflow-x:auto; overflow-y:visible; gap:.8em; padding-bottom:.4em; -webkit-overflow-scrolling:touch; align-items:stretch}
  .rail-group{flex:none; min-width:220px}
  .main{max-width:100%}
}

/* ---- XP bar ---- */
.xpbar{display:flex; align-items:center; gap:.8em; max-width:1180px; margin:0 auto .9em; padding:0 max(16px, env(safe-area-inset-left,0px)) 0 max(16px, env(safe-area-inset-right,0px))}
.xpbar .xp-title{font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--ink-dim); white-space:nowrap}
.xpbar .xp-track{flex:1; height:8px; border-radius:999px; background:var(--surface-2); border:1.5px solid var(--line); overflow:hidden}
.xpbar .xp-fill{height:100%; border-radius:999px; transition:width .4s ease}
.xpbar .xp-badge-count{font-family:var(--font-mono); font-size:.72rem; color:var(--ink-dim); white-space:nowrap; display:flex; align-items:center; gap:.3em}
.topbar,#xpbar,#main{position:relative; z-index:1}
h1,h2,h3,h4{letter-spacing:.01em}
.wordmark{text-shadow:0 0 12px rgba(0,229,255,.35)}
.btn-primary{box-shadow:0 0 0 1px var(--ink), 0 0 16px rgba(0,229,255,.25)}
.btn-water{box-shadow:0 0 14px rgba(0,229,255,.4)}
.btn-food{box-shadow:0 0 14px rgba(255,157,46,.4)}
.card,.card-flat{box-shadow:var(--shadow)}

/* ---- cards & chrome ---- */
.card{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius); padding:1.2em; box-shadow:var(--shadow); margin-bottom:1.1em}
.card-flat{background:var(--surface-2); border:1.5px solid var(--line); border-radius:var(--radius); padding:1em 1.1em; margin-bottom:.9em}
.eyebrow{font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--water-ink); font-weight:600; display:flex; align-items:center; gap:.5em; margin-bottom:.4em}
.eyebrow.food{color:var(--food-ink)}
.badge{display:inline-flex; align-items:center; gap:.35em; font-size:.74rem; font-weight:700; padding:.22em .6em; border-radius:999px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.03em}
.badge-good{background:var(--good-soft); color:var(--good)}
.badge-warn{background:var(--warn-soft); color:var(--warn)}
.badge-water{background:var(--water-soft); color:var(--water-ink)}
.badge-food{background:var(--food-soft); color:var(--food-ink)}
.badge-neutral{background:var(--surface-2); color:var(--ink-dim); border:1px solid var(--line)}
.divider{height:1.5px; background:var(--line); border:none; margin:1em 0}
.hero-band{position:relative; overflow:hidden; background:linear-gradient(155deg, #0a1030, #03050c 65%); border:1.5px solid var(--water); box-shadow:var(--shadow); color:var(--ink); border-radius:var(--radius); padding:1.5em 1.5em 1.4em; margin-bottom:1.2em}
.hero-band h1{color:#fff; text-shadow:0 0 14px rgba(0,229,255,.4)}
.hero-band p{color:var(--ink-dim)}
.hero-band .hero-copy{position:relative; z-index:1; max-width:60%}
.hero-band .hero-art{position:absolute; inset:auto -6% -4% auto; width:62%; max-width:340px; opacity:.95; pointer-events:none}
@media (max-width:620px){
  .hero-band .hero-copy{max-width:100%}
  .hero-band .hero-art{opacity:.22; inset:0; width:100%; max-width:none}
}
.scenario-banner{border-radius:var(--radius); overflow:hidden; margin-bottom:1em; height:140px; background:linear-gradient(155deg, #0a1030, #03050c 65%); border:1.5px solid var(--water)}
.scenario-banner svg{height:100%}
.icon-inline{display:inline-flex; align-items:center; gap:.45em}
.icon-inline svg{flex:none}
.hotspot-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:.7em}

/* ---- achievement badges + confetti ---- */
.badge-shelf{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:.8em}
.achv{display:flex; flex-direction:column; align-items:center; text-align:center; gap:.45em; padding:1em .6em; border-radius:12px; border:1.5px solid var(--line); background:var(--surface-2)}
.achv.earned{background:var(--surface); border-color:var(--food); box-shadow:var(--shadow)}
.achv .achv-ico{width:2.6em; height:2.6em; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--line); color:var(--ink-dim)}
.achv.earned .achv-ico{background:var(--food-soft); color:var(--food-ink)}
.achv .achv-name{font-size:.78rem; font-weight:700}
.achv .achv-desc{font-size:.7rem; color:var(--ink-dim); line-height:1.3}
#confettiLayer{position:fixed; inset:0; pointer-events:none; z-index:999}
@media (prefers-reduced-motion:reduce){ #confettiLayer{display:none} }

/* ---- narrator / mission-comms dialog (sits in normal flow above the
   step card, never overlapping nav buttons) ---- */
#narrator{max-width:1180px; margin:0 auto .9em; padding:0 max(16px, env(safe-area-inset-left,0px)) 0 max(16px, env(safe-area-inset-right,0px))}
#narrator[hidden]{display:none}
.narrator-inner{max-width:760px; margin:0 auto; display:flex; gap:.8em; align-items:flex-end}
.narrator-avatar{width:3em; height:3em; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; background:var(--surface); border:2px solid var(--water); color:var(--water); box-shadow:0 0 16px rgba(0,229,255,.5)}
.narrator-box{flex:1; background:var(--surface); border:1.5px solid var(--water); border-radius:12px 12px 12px 2px; padding:.9em 1.1em; box-shadow:var(--shadow); cursor:pointer; position:relative}
.narrator-name{font-family:var(--font-mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--plum); font-weight:700; margin-bottom:.25em}
.narrator-text{font-size:1rem; line-height:1.4; min-height:1.4em}
.narrator-adv{position:absolute; bottom:.5em; right:.7em; color:var(--water); font-size:.8rem}
.narrator-close{position:absolute; top:.4em; right:.5em; background:none; border:none; color:var(--ink-dim); font-size:.9rem; line-height:1; padding:.3em}
@media (prefers-reduced-motion:no-preference){
  .narrator-text.typing::after{content:'▌'; animation:blinkCaret .8s step-end infinite; color:var(--water)}
}
@keyframes blinkCaret{50%{opacity:0}}

/* ---- token planner ---- */
.token-grid{display:grid; grid-template-columns:1fr 1fr; gap:.7em}
@media (max-width:520px){ .token-grid{grid-template-columns:1fr} }
.token-row{display:flex; align-items:center; gap:.6em; background:var(--surface-2); border:1.5px solid var(--line); border-radius:8px; padding:.55em .7em}
.token-row .ico{width:2em; height:2em; border-radius:7px; display:flex; align-items:center; justify-content:center; flex:none; font-size:1em}
.token-row.water .ico{background:var(--water-soft); color:var(--water-ink)}
.token-row.food .ico{background:var(--food-soft); color:var(--food-ink)}
.token-row .tr-label{flex:1; min-width:0}
.token-row .tr-label .t-name{font-weight:600; font-size:.88rem; display:block}
.token-row .tr-label .t-sub{font-size:.74rem; color:var(--ink-dim)}
.token-row input{width:4.2em; text-align:right; font-family:var(--font-mono); font-weight:600; flex:none}
.token-total{display:flex; align-items:center; justify-content:space-between; padding:.9em 1em; border-radius:9px; margin-top:.9em; font-family:var(--font-mono); font-weight:700}
.token-total.ok{background:var(--good-soft); color:var(--good)}
.token-total.over{background:var(--warn-soft); color:var(--warn)}
.token-total .big{font-size:1.3rem}

/* ---- gallery / comparison wall ---- */
.wall-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:.9em}
.plan-card{border:1.5px solid var(--line); border-radius:var(--radius); padding:1em; background:var(--surface)}
.plan-card.mine{border-color:var(--water); box-shadow:0 0 0 2px var(--water-soft)}
.bar-chart{display:flex; flex-direction:column; gap:.3em; margin:.7em 0}
.bar-row{display:grid; grid-template-columns:5.6em 1fr 2.2em; align-items:center; gap:.5em; font-size:.74rem}
.bar-row .lab{color:var(--ink-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:inline-flex; align-items:center; gap:.3em}
.bar-row .lab svg{flex:none}
.bar-track{background:var(--surface-2); border-radius:5px; height:9px; overflow:hidden}
.bar-fill{height:100%; border-radius:5px}
.bar-fill.water{background:var(--water)} .bar-fill.food{background:var(--food)}
.bar-row .val{font-family:var(--font-mono); text-align:right}

/* ---- comments ---- */
.comment{border-left:3px solid var(--water); background:var(--surface-2); border-radius:0 8px 8px 0; padding:.6em .8em; margin-bottom:.6em; font-size:.9rem}
.comment .meta{font-size:.72rem; color:var(--ink-dim); margin-bottom:.2em; font-family:var(--font-mono)}
.comment.q{border-left-color:var(--food)}

/* ---- quiz ---- */
.quiz-opt{display:block; width:100%; text-align:left; padding:.65em .8em; border-radius:8px; border:1.5px solid var(--line); background:var(--surface); margin-bottom:.5em}
.quiz-opt[aria-pressed="true"]{border-color:var(--water); background:var(--water-soft)}
.quiz-opt.correct{border-color:var(--good); background:var(--good-soft)}
.quiz-opt.incorrect{border-color:var(--warn); background:var(--warn-soft)}

/* ---- tables (dashboard) ---- */
.tbl-wrap{overflow-x:auto; border:1.5px solid var(--line); border-radius:var(--radius)}
table{border-collapse:collapse; width:100%; font-size:.86rem; min-width:560px}
th,td{text-align:left; padding:.6em .8em; border-bottom:1px solid var(--line); vertical-align:top}
thead th{background:var(--surface-2); font-family:var(--font-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-dim); font-weight:600}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}

/* ---- dashboard stat tiles ---- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.8em; margin-bottom:1.1em}
.stat-tile{background:var(--surface); border:1.5px solid var(--line); border-radius:var(--radius); padding:1em}

// A small multi-segment ring chart for the teacher dashboard — segments is

// center total, used instead of a plain stat tile wherever a proportion
// (not just a count) is the more useful thing to show at a glance.
function donutChart(segments, opts){
  opts = opts || {};
  const size = opts.size || 108, stroke = opts.stroke || 14;
  const r = (size-stroke)/2, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const total = segments.reduce((s,seg)=>s+seg.value,0) || 1;
  let offset = 0;
  const arcs = segments.map(seg=>{
    const frac = seg.value/total;
    const dash = frac*circ;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" stroke-linecap="butt" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
    return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(opts.label||'')}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>

/* ---------------------------------------------------------------- *
 * 0b. CELEBRATION — a lightweight canvas confetti burst and a short
 *     synthesized chime, used to mark submissions and badge unlocks.
 *     Both are generated client-side (no audio/image assets), both
 *     respect prefers-reduced-motion / the sound-mute toggle, and
 *     both clean up after themselves.
 * ---------------------------------------------------------------- */
function prefersReducedMotion(){
  try{ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}
function confettiBurst(){
  if(prefersReducedMotion()) return;
  try{
    const canvas = document.createElement('canvas');
    canvas.id = 'confettiLayer';
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const colors = ['#00e5ff','#ff9d2e','#c061ff','#39ff9d','#ff3b6b'];
    const pieces = Array.from({length:70}, ()=>({
      x: canvas.width/2 + (Math.random()-0.5)*160,
      y: canvas.height*0.18 + (Math.random()-0.5)*40,
      vx: (Math.random()-0.5)*7,
      vy: Math.random()*-6 - 3,
      size: 5+Math.random()*5,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
    }));
    const gravity = 0.22;
    let frame = 0;
    const maxFrames = 95;
    function tick(){
      frame++;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(p=>{
        p.vy += gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.globalAlpha = Math.max(0, 1 - frame/maxFrames);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.66);
        ctx.restore();
      });
      if(frame<maxFrames) requestAnimationFrame(tick);
      else canvas.remove();
    }
    requestAnimationFrame(tick);
    setTimeout(()=>{ if(canvas.parentNode) canvas.remove(); }, 3000);
  }catch(e){ /* canvas unavailable — skip the celebration, never block the action */ }
}
let _audioCtx = null;
function playChime(kind){
  if(state && state.soundOn===false) return;
  try{
    _audioCtx = _audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const ctx = _audioCtx;
    const notes = kind==='badge' ? [523.3,659.3,784.0,1046.5] : [523.3,659.3,784.0];
    const now = ctx.currentTime;
    notes.forEach((freq,i)=>{
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      const t0 = now + i*0.09;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.11, t0+0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0+0.32);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0); osc.stop(t0+0.34);
    });
  }catch(e){ /* Web Audio unavailable — celebration continues silently */ }
}
function celebrate(kind){
  confettiBurst();

}

  narratorAdvance();
}
function narratorAdvance(){
  const textEl = document.getElementById('narratorText');
  const nameEl = document.getElementById('narratorName');
  if(!textEl) return;
  if(_narratorTyping){
    clearInterval(_narratorTimer);
    textEl.textContent = _narratorQueue._current || textEl.textContent;
    textEl.classList.remove('typing');
    _narratorTyping = false;
    return;
  }
  if(!_narratorQueue.length){ narratorClose(); return; }
  const line = _narratorQueue.shift();
  _narratorQueue._current = line.text;
  nameEl.textContent = line.name;
  if(prefersReducedMotion()){
    textEl.textContent = line.text;
    return;
  }
  _narratorTyping = true;
  textEl.textContent = '';
  textEl.classList.add('typing');
  let i = 0;
  _narratorTimer = setInterval(()=>{
    textEl.textContent += line.text.charAt(i);
    i++;
    if(i>=line.text.length){ clearInterval(_narratorTimer); _narratorTyping = false; textEl.classList.remove('typing'); }
  }, 18);
}
function narratorClose(){
  const box = document.getElementById('narrator');
  if(box) box.hidden = true;
  clearInterval(_narratorTimer);
  _narratorTyping = false;
  _narratorQueue = [];
}

/* ---------------------------------------------------------------- *
 * 0d. CONSEQUENCE ENGINE — reads a submitted token plan and narrates
 *     specific, descriptive consequences. This is deliberately NOT a
 *     score: the group's own consolidation material is explicit that
 *     no single allocation is "correct", so the engine never outputs
 *     a grade or ranking — only cause-and-effect text tied to the
 *     Four Taps / Food Story trade-offs, to support reasoning about
 *     the revision rather than optimising toward a hidden target.
 * ---------------------------------------------------------------- */
function evaluateConsequences(tokens){
  const t = tokens || {};
  const techWater = (t.newater||0) + (t.desal||0);
  const importWater = t.imported||0;
  const catchment = t.catchment||0;
  const importFood = (t.diversify||0) + (t.partner||0);
  const stockpile = t.stockpile||0;
  const localFood = t.growlocal||0;
  const out = [];
  if(importWater + catchment > 55 && techWater < 20){
    out.push({sev:'danger', text:'Water: heavy reliance on catchment and imported water with little NEWater/desalination backup — a prolonged regional dry spell would force rationing before rainfall-independent supply can absorb the shock.'});
  } else if(techWater > 50){
    out.push({sev:'warning', text:'Water: strong drought-proofing from NEWater/desalination, but that leans hard on energy — worth naming the cost trade-off in your justification.'});
  } else {
    out.push({sev:'ok', text:'Water: a workable spread across the Four Taps — no tap is left exposed on its own.'});
  }
  if(importFood < 20 && stockpile < 15){
    out.push({sev:'danger', text:'Food: low import diversification and a thin stockpile — a sudden export restriction (like 2022) would hit supermarket shelves within days, with little buffer.'});
  } else if(localFood > 35){
    out.push({sev:'warning', text:'Food: a big bet on Grow Local — land scarcity is the real constraint here, so this pillar alone can’t carry food security.'});
  } else {
    out.push({sev:'ok', text:'Food: diversified sourcing plus some buffer — reasonably resilient to a single-source shock.'});
  }
  return out;
}

    try{
      const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); done();
    }catch(e){ btnEl.textContent='Select & copy manually'; }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(fail); } else fail();
}

 * 4. STEP DEFINITIONS
 * ---------------------------------------------------------------- */
const STEPS = [
  {id:'welcome', lesson:'Before you begin', name:'Your group room', icon:'flag'},
  {id:'scenario', lesson:'Lesson 1', name:'Scenario briefing', icon:'cloud'},
  {id:'idea', lesson:'Lesson 1', name:'Your individual idea', icon:'sprout'},
  {id:'planner', lesson:'Lesson 1', name:'Group resource plan', icon:'box'},
  {id:'submit', lesson:'Lesson 1', name:'Submit your draft', icon:'chart'},
  {id:'jigsaw', lesson:'Lesson 2', name:'Evidence jigsaw', icon:'globe'},
  {id:'wall', lesson:'Lesson 2', name:'Comparison wall', icon:'handshake'},
  {id:'consolidate', lesson:'Lesson 2', name:'Teacher consolidation', icon:'recycle'},
  {id:'revise', lesson:'Lesson 2', name:'Revise your plan', icon:'wave'},
  {id:'writing', lesson:'Lesson 3', name:'Individual response', icon:'pencil'},
  {id:'reflect', lesson:'Lesson 3', name:'Reflection', icon:'star'},
  {id:'done', lesson:'Complete', name:'Journey summary', icon:'trophy'},
];
const ZONE_ICON = {
  'Before you begin':'flag', 'Lesson 1':'drop', 'Lesson 2':'basket',
  'Lesson 3':'pencil', 'Complete':'trophy',
};

function stepUnlocked(i){
  const g = g1();
  if(i<=0) return true;
  if(i===1) return true; // scenario always visible
  if(i===2) return true; // idea
  if(i===3) return true; // planner open throughout, locks after submit
  if(i===4) return tokensTotal(currentDraftTokens())>0 || g.plan.versions.length>0;
  if(i===5) return g.plan.versions.length>0; // jigsaw needs submission
  if(i===6) return g.plan.versions.length>0;
  if(i===7) return g.plan.versions.length>0;
  if(i===8) return g.plan.versions.length>0;
  if(i===9) return g.plan.versions.length>0; // writing can start after revise ideally, but not hard-gated
  if(i===10) return g.individualWriting.some(w=>w.studentId==='you');
  if(i===11) return g.reflections.some(r=>r.studentId==='you');
  return true;
}
let draftTokens = null; // working buffer for the planner before a version is created
function currentDraftTokens(){
  if(draftTokens) return draftTokens;
  const g=g1(); const last = latestPlan(g);
  draftTokens = last ? {...last.tokens} : blankTokens();
  return draftTokens;
}

const LESSON_ACCENT = {
  'Before you begin':'neutral', 'Lesson 1':'water', 'Lesson 2':'food',
  'Lesson 3':'plum', 'Complete':'good',
};

function renderRail(){
  // Group consecutive STEPS entries that share the same lesson, so each
  // lesson reads as one labelled, color-coded "zone" — a game-style path
  // of icon nodes connected by a dotted trail, rather than a flat list.
  const groups = [];
  STEPS.forEach((s,i)=>{
    const open = groups[groups.length-1];
    if(open && open.lesson===s.lesson) open.indices.push(i);
    else groups.push({lesson:s.lesson, indices:[i]});
  });
  return groups.map(grp=>{
    const accent = LESSON_ACCENT[grp.lesson] || 'neutral';
    const items = grp.indices.map(i=>{
      const s = STEPS[i];
      const unlocked = stepUnlocked(i);
      const isDone = i<state.step && unlocked;
      const nodeIcon = unlocked ? ic(s.icon,16) : ic('lock',14);
      return `<button class="rail-step ${isDone?'done':''}" data-step="${i}" ${i===state.step?'aria-current="step"':''} ${unlocked?'':'disabled'}>
        <span class="dot">${nodeIcon}${isDone?`<span class="star">${ic('star',10)}</span>`:''}</span>
        <span class="lbl"><span class="name">${esc(s.name)}</span></span>
      </button>`;
    }).join('');
    return `<div class="rail-group" data-accent="${accent}">
      <div class="rail-group-label"><span class="zone-badge">${ic(ZONE_ICON[grp.lesson]||'flag',14)}</span>${esc(grp.lesson)}</div>
      <div class="rail-group-items">${items}</div>
    </div>`;
  }).join('');
}

function tabOverview(){
  const groups = allGroups();
  const submitted = groups.filter(g=>g.plan.versions.length>0).length;

  const notStarted = groups.length - submitted;
  const submittedOnly = submitted - revised;
  const allScores = groups.flatMap(g=>Array.isArray(g.participation.feedbackScores)?g.participation.feedbackScores:[]);
  const avgFb = allScores.length? (allScores.reduce((a,b)=>a+b,0)/allScores.length).toFixed(1) : '—';
  const silentTotal = groups.reduce((s,g)=>s+(g.participation.silentMembers||[]).length,0);
  const qcAvg = (()=>{ const a=groups.filter(g=>g.quickCheck.attempted); if(!a.length) return '—'; return (a.reduce((s,g)=>s+g.quickCheck.score,0)/a.length).toFixed(1)+' / 4'; })();
  const qcAvgFrac = (()=>{ const a=groups.filter(g=>g.quickCheck.attempted); if(!a.length) return 0; return a.reduce((s,g)=>s+g.quickCheck.score,0)/a.length/4; })();
  const writingCount = groups.reduce((s,g)=>s+g.individualWriting.length,0);

  return `
  <div class="card">
    <h3 style="margin-bottom:.9em">Class progress at a glance</h3>
    <div class="donut-row">

        ${donutChart([

        </div>
      </div>
      <div class="donut-item">
        ${donutChart([
          {value:qcAvgFrac*100, color:'var(--food)'},
          {value:100-qcAvgFrac*100, color:'var(--line)'},
        ], {center:qcAvg, centerSub:'quick check', label:'Average quick-check score'})}

      </div>
    </div>

  <div class="stat-grid">

    <div class="stat-tile"><span class="n mono">${revised} / 8</span><span class="l">Groups who have revised</span></div>
    <div class="stat-tile"><span class="n mono">${avgFb}</span><span class="l">Avg. peer-feedback quality (0–2)</span></div>

    <div class="tbl-wrap"><table><thead><tr><th>Group</th><th>All contributed?</th><th>Silent members</th><th>Peer-feedback quality</th><th>Quick check</th></tr></thead><tbody>
      ${groups.map(g=>`<tr>

/* ---------------------------------------------------------------- *
 * 7. EVENTS

function goto(step){
  narratorClose();
  state.step = step; saveState(); render(); window.scrollTo({top:0,behavior:'smooth'});
  const id = STEPS[step] && STEPS[step].id;
  if(id) narratorFire(id);
}

function wireEvents(){
  const main = document.getElementById('main');

  main.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>goto(Number(b.dataset.goto))));
  main.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click', ()=>{ if(!b.disabled) goto(Number(b.dataset.step)); }));

  const enterJourney = main.querySelector('#enterJourney');
  if(enterJourney) enterJourney.addEventListener('click', ()=>{ state.view='journey'; state.step=0; saveState(); render(); narratorFire('welcome'); });
  const enterDash = main.querySelector('#enterDash');
  if(enterDash) enterDash.addEventListener('click', ()=>{ state.view='dashboard'; saveState(); render(); });
  const goDashFromDone = main.querySelector('#goDashFromDone');
  if(goDashFromDone) goDashFromDone.addEventListener('click', ()=>{ state.view='dashboard'; saveState(); render(); });

  // token inputs (planner + revise)
  main.querySelectorAll('input[data-tok]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const t = currentDraftTokens();
      t[inp.dataset.tok] = Math.max(0, Math.min(999, Number(inp.value)||0));
      const total = tokensTotal(t);
      const totalEl = main.querySelector('.token-total');
      if(totalEl){
        totalEl.classList.toggle('over', total>100);
        totalEl.classList.toggle('ok', total<=100);
        const big = totalEl.querySelector('.big'); if(big) big.textContent = total+' / 100';
      }
      const submitBtn = main.querySelector('#submitDraft, #submitRevision');
      if(submitBtn) submitBtn.disabled = total===0 || total>100;
    });
  });

  // idea
  const saveIdea = main.querySelector('#saveIdea');
  if(saveIdea) saveIdea.addEventListener('click', ()=>{
    const val = main.querySelector('#ideaInput').value.trim();
    const g = g1();
    let mine = g.individualIdeas.find(i=>i.studentId==='you');
    if(!mine){ mine = {studentId:'you', text:'', submittedAt:null}; g.individualIdeas.unshift(mine); }
    mine.text = val; mine.submittedAt = new Date().toISOString();
    checkBadges(); saveState(); render();
  });

  // submit draft (v1)
  const submitDraft = main.querySelector('#submitDraft');
  if(submitDraft) submitDraft.addEventListener('click', ()=>{
    const g = g1(); const t = currentDraftTokens();
    const risk = (document.getElementById('riskInput')||{}).value || '';
    const just = (document.getElementById('justInput')||{}).value || '';
    g.plan.versions.push({version:1, tokens:{...t}, risk, justification:just, timestamp:new Date().toISOString(), submittedBy:'You'});
    draftTokens=null; checkBadges(); saveState(); render(); narratorFire('submit');
  });

  // planner risk/justification live buffer (so they survive navigation before submit)
  const riskInput = main.querySelector('#riskInput');
  if(riskInput) riskInput.addEventListener('input', ()=>{ state.draftRisk = riskInput.value; });
  const justInput = main.querySelector('#justInput');
  if(justInput) justInput.addEventListener('input', ()=>{ state.draftJust = justInput.value; });

  // jigsaw
  main.querySelectorAll('[data-jig]').forEach(b=>b.addEventListener('click', ()=>{
    const g=g1(); g.jigsaw.memberSet = g.jigsaw.memberSet||{}; g.jigsaw.memberSet.you = b.dataset.jig; saveState(); render();
  }));
  const saveJigNotes = main.querySelector('#saveJigNotes');
  if(saveJigNotes) saveJigNotes.addEventListener('click', ()=>{ g1().jigsaw.notes = main.querySelector('#jigNotes').value; saveState(); });

  // wall comments
  main.querySelectorAll('[data-comment-on]').forEach(b=>b.addEventListener('click', ()=>{
    const gid = b.dataset.commentOn; const target = state.groups[gid];
    const strength = prompt('One evidence-supported strength in '+target.name+"'s plan:");
    if(strength===null) return;
    const question = prompt('A probing question for them (e.g. "What trade-off moves if...?")');
    if(question===null) return;
    const g = g1();
    g.commentsGiven.push({toGroup:gid, toGroupName:target.name, strength, question, at:new Date().toISOString()});
    checkBadges(); saveState(); render();
  }));

  // quick check
  main.querySelectorAll('[data-qc]').forEach(b=>b.addEventListener('click', ()=>{
    const qi = Number(b.dataset.qc), oi = Number(b.dataset.oi);
    const qcState = state.quiz = state.quiz || {answered:{}};
    if(qcState.answered[qi]!=null) return;
    qcState.answered[qi]=oi;
    const g=g1();
    const correctCount = Object.keys(qcState.answered).filter(k=>Number(qcState.answered[k])===QUICK_CHECK[k].correct).length;
    g.quickCheck = {score:correctCount, total:QUICK_CHECK.length, attempted: Object.keys(qcState.answered).length===QUICK_CHECK.length};
    checkBadges(); saveState(); render();
  }));

  // revise
  const submitRevision = main.querySelector('#submitRevision');
  if(submitRevision) submitRevision.addEventListener('click', ()=>{
    const g=g1(); const t=currentDraftTokens();
    const reason = (document.getElementById('reviseReason')||{}).value||'';
    const nextV = g.plan.versions.length+1;
    g.plan.versions.push({version:nextV, tokens:{...t}, risk:g.plan.versions[0].risk, justification:reason, timestamp:new Date().toISOString(), submittedBy:'You'});
    draftTokens=null; state.reviseReason=''; checkBadges(); saveState(); render();
  });
  const reviseReason = main.querySelector('#reviseReason');
  if(reviseReason) reviseReason.addEventListener('input', ()=>{ state.reviseReason = reviseReason.value; });

  // writing
  const frameToggle = main.querySelector('#frameToggle');
  if(frameToggle) frameToggle.addEventListener('change', ()=>{ state.showFrame = frameToggle.checked; render(); });
  const writingInput = main.querySelector('#writingInput');
  if(writingInput) writingInput.addEventListener('input', ()=>{ state.writingDraft = writingInput.value; });
  main.querySelectorAll('[data-celj]').forEach(b=>b.addEventListener('click', ()=>{
    const ta = main.querySelector('#writingInput'); if(!ta) return;
    const key = b.dataset.celj;
    const prefix = ta.value && !ta.value.endsWith('\n\n') ? (ta.value.endsWith('\n')?'\n':'\n\n') : '';
    ta.value += prefix + CELJ_PROMPTS[key] + ' ';
    state.writingDraft = ta.value;
    ta.focus(); ta.scrollTop = ta.scrollHeight;
  }));
  const saveWriting = main.querySelector('#saveWriting');
  if(saveWriting) saveWriting.addEventListener('click', ()=>{
    const g=g1(); let mine = g.individualWriting.find(w=>w.studentId==='you');
    const val = main.querySelector('#writingInput').value.trim();
    if(!mine){ mine = {studentId:'you', studentName:'You', text:'', aiCoachLog:'', teacherFeedback:'', lormsLevel:null, graded:false}; g.individualWriting.push(mine); }
    mine.text = val; mine.submittedAt = new Date().toISOString();
    checkBadges(); saveState(); render();
  });
  const aiLog = main.querySelector('#aiLog');
  if(aiLog) aiLog.addEventListener('input', ()=>{ state.aiLogDraft = aiLog.value; });
  const saveAiLog = main.querySelector('#saveAiLog');
  if(saveAiLog) saveAiLog.addEventListener('click', ()=>{
    const g=g1(); let mine = g.individualWriting.find(w=>w.studentId==='you');
    if(!mine){ mine = {studentId:'you', studentName:'You', text:state.writingDraft||'', aiCoachLog:'', teacherFeedback:'', lormsLevel:null, graded:false}; g.individualWriting.push(mine); }
    mine.aiCoachLog = main.querySelector('#aiLog').value;
    saveState(); render();
  });

  // reflect
  const reflectInput = main.querySelector('#reflectInput');
  if(reflectInput) reflectInput.addEventListener('input', ()=>{ state.reflectDraft = reflectInput.value; });
  const saveReflect = main.querySelector('#saveReflect');
  if(saveReflect) saveReflect.addEventListener('click', ()=>{
    const g=g1(); let mine = g.reflections.find(r=>r.studentId==='you');
    const val = main.querySelector('#reflectInput').value.trim();
    if(!mine){ mine={studentId:'you', studentName:'You', text:'', at:null}; g.reflections.push(mine); }
    mine.text = val; mine.at = new Date().toISOString();
    checkBadges(); saveState(); render();
  });

  // dashboard tabs
  main.querySelectorAll('[data-ttab]').forEach(b=>b.addEventListener('click', ()=>{ state.tTab=b.dataset.ttab; saveState(); render(); }));
  main.querySelectorAll('[data-selgroup]').forEach(b=>b.addEventListener('click', ()=>{ state.selectedGroup=b.dataset.selgroup; render(); }));

  // writing review (teacher)
  main.querySelectorAll('[data-levelrow]').forEach(sel=>sel.addEventListener('change', ()=>{
    const [gid,idx] = sel.dataset.levelrow.split(':');
    const w = state.groups[gid].individualWriting[Number(idx)];
    const v = Number(sel.value); w.lormsLevel = v<0?null:v; saveState();
  }));
  main.querySelectorAll('[data-feedbackrow]').forEach(inp=>inp.addEventListener('change', ()=>{
    const [gid,idx] = inp.dataset.feedbackrow.split(':');
    state.groups[gid].individualWriting[Number(idx)].teacherFeedback = inp.value; saveState();
  }));

  // ai coach toggle
  const aiCoachToggle = main.querySelector('#aiCoachToggle');
  if(aiCoachToggle) aiCoachToggle.addEventListener('change', ()=>{ state.aiCoachEnabled = aiCoachToggle.checked; saveState(); });

  // usability
  const addUsability = main.querySelector('#addUsability');
  if(addUsability) addUsability.addEventListener('click', ()=>{
    const val = main.querySelector('#newUsability').value.trim(); if(!val) return;
    state.usabilityNotes.unshift({by:'Teacher', note:val, at:new Date().toISOString()});
    saveState(); render();
  });

  // settings
  const exportBtn = main.querySelector('#exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const area = main.querySelector('#exportArea');
    area.value = JSON.stringify(state, null, 2); area.hidden=false;
    copyToClipboard(area.value, exportBtn);
  });
  const resetBtn = main.querySelector('#resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{ resetAll(); });

  // quiz "why" reveal already shown via class; add correctness styling after click (re-render handles disabled-looking via answered map)
  if(state.quiz && state.quiz.answered){
    Object.entries(state.quiz.answered).forEach(([qi,oi])=>{
      main.querySelectorAll(`[data-qc="${qi}"]`).forEach(btn=>{
        const o = Number(btn.dataset.oi);
        btn.disabled = true;
        if(o===QUICK_CHECK[qi].correct) btn.classList.add('correct');
        else if(o===Number(oi)) btn.classList.add('incorrect');
      });
      const why = main.querySelector(`[data-why="${qi}"]`); if(why) why.hidden=false;
    });
  }
}

/* ---------------------------------------------------------------- *
 * 8. GLOBAL CHROME EVENTS
 * ---------------------------------------------------------------- */
document.getElementById('btnViewStudent').addEventListener('click', ()=>{ narratorClose(); state.view = 'journey'; saveState(); render(); });
document.getElementById('btnViewTeacher').addEventListener('click', ()=>{ narratorClose(); state.view='dashboard'; saveState(); render(); });
document.getElementById('fsUp').addEventListener('click', ()=>{ state.fontStep = Math.min(3,(state.fontStep||0)+1); applyA11y(); saveState(); });
document.getElementById('fsDown').addEventListener('click', ()=>{ state.fontStep = Math.max(-1,(state.fontStep||0)-1); applyA11y(); saveState(); });
document.getElementById('contrastBtn').addEventListener('click', ()=>{
  state.theme = state.theme==='dark' ? 'light' : (state.theme==='light' ? 'system' : 'dark');
  applyA11y(); saveState();
});
function updateSoundBtn(){
  const b = document.getElementById('soundBtn');
  if(!b) return;
  const on = state.soundOn!==false;
  b.style.opacity = on?'1':'.45';
  b.setAttribute('aria-pressed', String(on));
  b.title = on ? 'Sound on — click to mute' : 'Sound muted — click to unmute';
}
document.getElementById('soundBtn').addEventListener('click', ()=>{
  state.soundOn = state.soundOn===false ? true : false;
  updateSoundBtn(); saveState();
  if(state.soundOn) playChime('tick');
});
document.getElementById('narratorBox').addEventListener('click', narratorAdvance);
document.getElementById('narratorClose').addEventListener('click', (e)=>{ e.stopPropagation(); narratorClose(); });

/* ---------------------------------------------------------------- *
 * 9. BOOT
 * ---------------------------------------------------------------- */
function start(hotData){
  state = (hotData && hotData.state) ? hotData.state : loadState();
  applyA11y();
  render();
}
if (window.claude && window.claude.hot) {
  window.claude.hot.snapshot(() => ({ state }));
  window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data || {});
} else {
  start();
}

})();
</script>

</body></html>
